name: Prepare Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching app/build.gradle.kts
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Regenerate Gradle Wrapper
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & gradle wrapper --gradle-version 9.3.1
        if ($LASTEXITCODE -ne 0) { throw 'Unable to regenerate Gradle wrapper' }

    - name: Accept Android SDK licenses
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $sdkManager = "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        ((1..100 | ForEach-Object { 'y' }) -join "`n") | & $sdkManager --licenses
        if ($LASTEXITCODE -ne 0) { Write-Warning 'Android SDK license command returned a non-zero exit code' }

    - name: Grant execute permission for gradlew
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & chmod '+x' 'gradlew'
        if ($LASTEXITCODE -ne 0) { throw 'Unable to make gradlew executable' }

    - name: Build signed release candidate
      id: build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & '.github/scripts/build-signed-release.ps1'

    - name: Prepare draft release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        & '.github/scripts/prepare-draft-release.ps1' `
          -Version '${{ inputs.version }}' `
          -ApkPath '${{ steps.build.outputs.apk_path }}' `
          -TargetCommit '${{ github.sha }}'
